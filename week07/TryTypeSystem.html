<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Try JS Type System</title>
</head>
<body>

<script>

    /**
     * @typedef ABType
     * @property { Number } a - some text
     * @property { "a"|"b"|"c" } b - some text
     */
    /** @type { ABType } */
    const x =  {a:1,b:"c"};

    /** @type { Array<Number> } */
    const arr = [1,2,3];

    /**
     * @type  { <_T_>  (argument:_T_) => _T_ }
     */
    const addOne = argument => {
        return (argument + 1);
    };

    document.writeln( String(addOne(42)) );
    document.writeln(addOne("42") );

</script>

</body>
</html>
